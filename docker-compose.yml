services:
  db:
    image: postgres:15-alpine
    container_name: time_intel_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_habit_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: time_intel_backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  telegram:
    build:
      context: ./telegram
      dockerfile: Dockerfile
    container_name: time_intel_telegram
    depends_on:
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "8080:8080"
    restart: unless-stopped

  scheduler:
    build:
      # Repo-root context: the scheduler imports the shared, pure-function
      # slot_engine/allocator from backend/app/services (TRD Section 6.4).
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: time_intel_scheduler
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      BACKEND_API_URL: http://backend:8000
    restart: unless-stopped

  # Static production build of the SPA. Not needed for local dev — run
  # `npm run dev` in frontend/ instead, it proxies /auth and /api to the backend.
  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: time_intel_frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  postgres_data:
