version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: time_intel_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_habit_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: time_intel_backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  telegram:
    build: 
      context: ./telegram
      dockerfile: Dockerfile
    container_name: time_intel_telegram
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./telegram:/app

  scheduler:
    build: 
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: time_intel_scheduler
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./scheduler:/app

volumes:
  postgres_data:
